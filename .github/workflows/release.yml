name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo xtask fetch-ghostty
      - run: cargo xtask bundle
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/release/bundle/*.zip

  flatpak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder python3-aiohttp python3-tomlkit python3-yaml
          # Ubuntu 24.04 blocks the unprivileged user namespaces bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build
        run: packaging/flatpak/build.sh
      - run: mv target/flatpak/codeducky.flatpak "CodeDucky-${GITHUB_REF_NAME#v}-linux-x86_64.flatpak"
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: '*.flatpak'

  release:
    needs: [macos, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            *.zip
            *.flatpak
