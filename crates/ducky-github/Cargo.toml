[package]
name = "ducky-github"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# A fake GitHub (in-process HTTP server and a stateful pull request world) for tests and dev runs.
test-support = ["dep:similar"]

[dependencies]
base64.workspace = true
ducky-git.workspace = true
ducky-host.workspace = true
ducky-review.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
similar = { workspace = true, optional = true }
thiserror.workspace = true
ureq.workspace = true

[dev-dependencies]
ducky-github = { path = ".", features = ["test-support"] }

[lints]
workspace = true
