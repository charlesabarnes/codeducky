# Deployed on gangway: preview secrets reach compose as .env, so they are interpolated here.
services:
  web:
    build: .
    environment:
      NODE_ENV: production
      PORT: '8787'
      DATA_DIR: /data
      CODEDUCKY_PUBLIC_URL: ${CODEDUCKY_PUBLIC_URL:?set CODEDUCKY_PUBLIC_URL to the public https origin}
      # Required unless CODEDUCKY_GITHUB_FAKE=1 with CODEDUCKY_INSECURE_FAKE_GITHUB=1 (throwaway previews only).
      CODEDUCKY_GITHUB_CLIENT_ID: ${CODEDUCKY_GITHUB_CLIENT_ID:-}
      CODEDUCKY_GITHUB_CLIENT_SECRET: ${CODEDUCKY_GITHUB_CLIENT_SECRET:-}
      CODEDUCKY_GITHUB_FAKE: ${CODEDUCKY_GITHUB_FAKE:-}
      CODEDUCKY_INSECURE_FAKE_GITHUB: ${CODEDUCKY_INSECURE_FAKE_GITHUB:-}
      # Unset turns admin sign-in off.
      CODEDUCKY_ADMIN_PASSPHRASE: ${CODEDUCKY_ADMIN_PASSPHRASE:-}
      CODEDUCKY_SIGNUPS: ${CODEDUCKY_SIGNUPS:-open}
      CODEDUCKY_MAX_USERS: ${CODEDUCKY_MAX_USERS:-}
      CODEDUCKY_QUOTA_RECORDS: ${CODEDUCKY_QUOTA_RECORDS:-}
      CODEDUCKY_QUOTA_BYTES: ${CODEDUCKY_QUOTA_BYTES:-}
      CODEDUCKY_RATE_SYNC: ${CODEDUCKY_RATE_SYNC:-}
      CODEDUCKY_RATE_MCP: ${CODEDUCKY_RATE_MCP:-}
      CODEDUCKY_RATE_GATE: ${CODEDUCKY_RATE_GATE:-}
      CODEDUCKY_RATE_CHANNEL_TASKS: ${CODEDUCKY_RATE_CHANNEL_TASKS:-}
      CODEDUCKY_RATE_GITHUB_START: ${CODEDUCKY_RATE_GITHUB_START:-}
      CODEDUCKY_RATE_NEW_ACCOUNTS: ${CODEDUCKY_RATE_NEW_ACCOUNTS:-}
      CODEDUCKY_RATE_PUSH: ${CODEDUCKY_RATE_PUSH:-}
      # All three, or none to turn Web Push off (npm run vapid).
      CODEDUCKY_VAPID_PUBLIC_KEY: ${CODEDUCKY_VAPID_PUBLIC_KEY:-}
      CODEDUCKY_VAPID_PRIVATE_KEY: ${CODEDUCKY_VAPID_PRIVATE_KEY:-}
      CODEDUCKY_VAPID_SUBJECT: ${CODEDUCKY_VAPID_SUBJECT:-}
    expose:
      - '8787'
    volumes:
      - type: volume
        source: data
        target: /data
    x-gangway:
      expose: true
      port: 8787
      health: /api/health

volumes:
  data:

x-gangway:
  idle: never
