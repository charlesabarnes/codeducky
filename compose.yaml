# Deployed on gangway: preview secrets reach compose as .env, so they are interpolated here.
services:
  web:
    build: .
    environment:
      NODE_ENV: production
      PORT: '8787'
      DATA_DIR: /data
      CODEDUCKY_PASSPHRASE: ${CODEDUCKY_PASSPHRASE:?set the CODEDUCKY_PASSPHRASE secret}
      CODEDUCKY_PUBLIC_URL: ${CODEDUCKY_PUBLIC_URL:-}
    expose:
      - '8787'
    volumes:
      - type: volume
        source: data
        target: /data
    x-gangway:
      expose: true
      port: 8787
      health: /api/health

volumes:
  data:

x-gangway:
  idle: never
