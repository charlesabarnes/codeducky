# Deployed on gangway: preview secrets reach compose as .env, so they are interpolated here.
services:
  web:
    build: .
    environment:
      NODE_ENV: production
      PORT: '8787'
      DATA_DIR: /data
      RUBBERDUCK_PASSPHRASE: ${RUBBERDUCK_PASSPHRASE:?set the RUBBERDUCK_PASSPHRASE secret}
      RUBBERDUCK_PUBLIC_URL: ${RUBBERDUCK_PUBLIC_URL:-}
    expose:
      - '8787'
    volumes:
      - type: volume
        source: data
        target: /data
    x-gangway:
      expose: true
      port: 8787
      health: /api/health

volumes:
  data:

x-gangway:
  idle: never
